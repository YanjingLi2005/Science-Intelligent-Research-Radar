name: Deploy Independent Research Radar

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: Docker image profile to build and deploy
        required: true
        default: standard
        type: choice
        options:
          - standard
          - enhanced

concurrency:
  group: research-radar-new-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_HOST_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}

    steps:
      - name: Check deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_HOST_FINGERPRINT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          profile="${{ inputs.profile || 'standard' }}"
          case "${profile}" in
            standard) extras="" ;;
            enhanced) extras="full" ;;
            *) echo "Unsupported profile: ${profile}" >&2; exit 2 ;;
          esac
          image_repository="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image_tag="sha-${GITHUB_SHA::12}-${profile}"
          echo "profile=${profile}" >> "${GITHUB_OUTPUT}"
          echo "extras=${extras}" >> "${GITHUB_OUTPUT}"
          echo "image_repository=${image_repository}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish private image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.image_repository }}:${{ steps.vars.outputs.image_tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            PIP_INDEX_URL=https://pypi.org/simple
            INSTALL_EXTRAS=${{ steps.vars.outputs.extras }}
            TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu/
          cache-from: type=gha,scope=research-radar-${{ steps.vars.outputs.profile }}
          cache-to: type=gha,mode=max,scope=research-radar-${{ steps.vars.outputs.profile }}

      - name: Verify server SSH host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          ssh-keyscan -p "${SERVER_PORT}" -t ed25519 "${SERVER_HOST}" > "${HOME}/.ssh/known_hosts"
          actual="$(ssh-keygen -lf "${HOME}/.ssh/known_hosts" -E sha256 | awk '{print $2}')"
          if [ "${actual}" != "${SERVER_HOST_FINGERPRINT}" ]; then
            echo "::error::Server SSH host fingerprint did not match the configured value"
            exit 1
          fi

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Authenticate server to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${SERVER_PORT}" \
            "${SERVER_USER}@${SERVER_HOST}" \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Deploy as an independent Compose project
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.vars.outputs.image_repository }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          PROFILE: ${{ steps.vars.outputs.profile }}
        run: |
          set -euo pipefail
          DEPLOY_SCRIPT_B64="$(base64 < scripts/deploy_new_server.sh | tr -d '\n')"
          COMPOSE_B64="$(base64 < docker-compose.new.yml | tr -d '\n')"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${SERVER_PORT}" \
            "${SERVER_USER}@${SERVER_HOST}" \
            "set -e; \
             mkdir -p /root/research-radar-new/scripts; \
             echo '${DEPLOY_SCRIPT_B64}' | base64 -d > /root/research-radar-new/scripts/deploy_new_server.sh; \
             chmod +x /root/research-radar-new/scripts/deploy_new_server.sh; \
             echo '${COMPOSE_B64}' | base64 -d > /root/research-radar-new/docker-compose.new.yml; \
             cd /root/research-radar-new; \
             RADAR_IMAGE_REPOSITORY='${IMAGE_REPOSITORY}' \
             RADAR_IMAGE_TAG='${IMAGE_TAG}' \
             RADAR_PROFILE='${PROFILE}' \
             bash scripts/deploy_new_server.sh"
